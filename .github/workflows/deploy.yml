name: CI/CD Build & Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/weatherparser:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weatherparser:${{ github.sha }}

  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,BOT_TOKEN
          script: |
            set -e
            echo "🚀 Starting deployment of Weather Parser Bot..."

            APP_DIR=~/weatherparser
            mkdir -p $APP_DIR/data
            cd $APP_DIR

            # Ensure .env exists with necessary variables
            if [ ! -f .env ]; then
              echo "Creating initial .env file..."
              cat << EOF > .env
            BOT_TOKEN=${BOT_TOKEN}
            CITY_NAME=Санкт-Петербург
            LATITUDE=59.9343
            LONGITUDE=30.3351
            TIMEZONE=Europe/Moscow
            BROADCAST_TIME=07:00
            DATABASE_URL=sqlite+aiosqlite:///./data/weather.db
            EOF
            fi

            # Pull latest image from Docker Hub
            echo "Pulling latest Docker image: ${DOCKERHUB_USERNAME}/weatherparser:latest"
            docker pull ${DOCKERHUB_USERNAME}/weatherparser:latest

            # Stop and remove existing container if running
            if [ "$(docker ps -aq -f name=weatherparser_bot)" ]; then
              echo "Stopping existing weatherparser_bot container..."
              docker stop weatherparser_bot || true
              docker rm weatherparser_bot || true
            fi

            # Run new container with restart policy and persistent volume
            echo "Starting updated container..."
            docker run -d \
              --name weatherparser_bot \
              --restart unless-stopped \
              --env-file .env \
              -v $APP_DIR/data:/app/data \
              -e TZ=Europe/Moscow \
              ${DOCKERHUB_USERNAME}/weatherparser:latest

            # Prune dangling images to save server disk space
            docker image prune -f

            echo "✅ Deployment completed successfully! Container status:"
            docker ps -f name=weatherparser_bot
