name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: CI: Linting & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check import ordering (isort)
        run: |
          python -m isort --check --diff app/ tests/

      - name: Check PEP 8 code style (flake8 <= 79 chars)
        run: |
          python -m flake8 app/ tests/ --max-line-length=79 --show-source

      - name: Run unit & integration tests (pytest)
        run: |
          python -m pytest -v

  build-and-push:
    name: CD: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/weatherparser:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weatherparser:${{ github.sha }}

  deploy:
    name: CD: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,BOT_TOKEN
          script: |
            set -e
            echo "🚀 Starting deployment of Weather Parser Bot..."

            APP_DIR=/root/weatherparser
            mkdir -p $APP_DIR/data
            cd $APP_DIR

            # Create or update docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              weatherparser:
                image: ${DOCKERHUB_USERNAME}/weatherparser:latest
                container_name: weatherparser_bot
                restart: unless-stopped
                env_file:
                  - .env
                volumes:
                  - ./data:/app/data
                environment:
                  - TZ=Europe/Moscow
            EOF

            # Ensure .env exists with required parameters
            if [ ! -f .env ]; then
              echo "Creating initial .env file..."
              cat << EOF > .env
            BOT_TOKEN=${BOT_TOKEN}
            CITY_NAME=Санкт-Петербург
            LATITUDE=59.9343
            LONGITUDE=30.3351
            TIMEZONE=Europe/Moscow
            BROADCAST_TIME=07:00
            DATABASE_URL=sqlite+aiosqlite:///./data/weather.db
            EOF
            fi

            # Export DOCKERHUB_USERNAME for docker-compose interpolation
            export DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}

            # Pull latest image and recreate container
            echo "Pulling latest Docker image: ${DOCKERHUB_USERNAME}/weatherparser:latest"
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment completed successfully! Container status:"
            docker ps -f name=weatherparser_bot
