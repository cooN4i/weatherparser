services:
  weatherparser:
    image: ${DOCKERHUB_USERNAME:-kyloggg}/weatherparser:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherparser_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - TZ=Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
